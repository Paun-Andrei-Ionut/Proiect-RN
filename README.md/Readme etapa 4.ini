## 4. Scheletul Complet al Modulelor

Sistemul este împărțit în 3 module funcționale independente, conform cerințelor de arhitectură software:

### Modul 1: Data Logging / Acquisition
- **Cale:** `src/data_acquisition/collect_data.py`
- **Funcționalitate:** Permite utilizatorului să construiască rapid un set de date propriu.
- **Detalii:** Scriptul utilizează OpenCV pentru a accesa camera și salvează imaginile direct în structura de foldere necesară antrenării (`data/generated/{categorie}/`). Include feedback vizual (chenar) pentru încadrare corectă.

### Modul 2: Neural Network Module
- **Cale:** `src/neural_network/`
- **Componente:** - `train_model.py`: Definirea și antrenarea arhitecturii CNN (Conv2D + MaxPooling + Dropout).
  - `evaluate.py`: Script pentru generarea matricei de confuzie și a rapoartelor de performanță pe setul de test.
- **Model:** Arhitectura compilată este salvată în `models/model_final.keras`.

### Modul 3: Web Service / UI (Aplicația Principală)
- **Cale:** `src/app/main.py`
- **Funcționalitate:** Integrează camera web, logica de State Machine și modelul antrenat pentru a oferi predicții în timp real.
- **Input:** Flux video live + Tasta SPACE (Trigger senzor prezență).
- **Output:** Suprapunere grafică pe video cu clasa detectată și nivelul de încredere (%). Afișează starea curentă a sistemului (IDLE, PROCESSING, etc.).

