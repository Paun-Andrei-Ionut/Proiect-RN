## 3. Diagrama State Machine a Întregului Sistem

**Locația diagramei:** `docs/state_machine.png`

![State Machine Diagram](docs/state_machine.png)

### Justificarea State Machine-ului ales:

Am ales o arhitectură de tip **Event-Driven Sequence (Secvență declanșată de eveniment)**, deoarece procesul de sortare a deșeurilor este discret: sistemul așteaptă apariția unui obiect, îl procesează și apoi revine la starea inițială.

**Stările principale sunt:**
1. **IDLE:** Sistemul așteaptă în mod economic declanșarea senzorului (simulat prin tasta SPACE) pentru a nu consuma resurse inutil.
2. **PREPROCESS:** Imaginea capturată este decupată (Center Crop) pentru a elimina fundalul irelevant și redimensionată la 224x224 pixeli (input-ul CNN-ului).
3. **INFERENCE:** Modelul CNN primește imaginea procesată și returnează un vector de probabilități pentru cele 6 clase.
4. **DECISION & ACTUATION:** Se aplică un prag de siguranță (45%). Dacă modelul este nesigur, obiectul este marcat ca "UNKNOWN" pentru a preveni contaminarea fluxului de sortare.

**Tranzițiile critice:**
- **IDLE → CAPTURE:** Trebuie să fie instantanee (latență minimă) pentru a prinde obiectul în mișcare pe bandă.
- **DECISION → ACTUATION:** Determină acțiunea fizică (afișarea rezultatului pe ecran în această etapă de prototipare).

