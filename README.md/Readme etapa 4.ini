## 2. Contribuția Originală la Setul de Date

**Total observații finale:** 1500 imagini  
**Observații originale:** 600 (40%)

**Tipul contribuției:**
[X] Date achiziționate cu senzori proprii  
[ ] Date generate prin simulare fizică  
[ ] Etichetare/adnotare manuală  

**Descriere detaliată:**
Am dezvoltat un modul software dedicat (`src/data_acquisition/collect_data.py`) care permite capturarea rapidă a imaginilor utilizând camera web și etichetarea lor automată în foldere specifice (`glass`, `paper`, etc.) prin apăsarea tastelor dedicate.

Pentru a respecta regula de 40% și a asigura robustețea modelului la condiții reale, am utilizat acest modul pentru a fotografia deșeuri reale din gospodărie. Am aplicat o strategie de achiziție variată:
1.  **Unghiuri multiple:** Fiecare obiect a fost rotit la 360 de grade.
2.  **Iluminare:** S-au capturat imagini atât la lumină naturală, cât și artificială.
3.  **Fundal:** S-a utilizat un fundal neutru, dar și unul complex pentru a testa capacitatea de generalizare.

**Locația codului:** `src/data_acquisition/collect_data.py`  
**Locația datelor:** `data/generated/`

