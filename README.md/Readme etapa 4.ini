## Scopul Etapei 4
Această etapă prezintă scheletul complet și funcțional al Sistemului cu Inteligență Artificială (SIA) pentru sortarea automată a deșeurilor. Aplicația integrează achiziția de date, modelul neuronal și interfața de utilizare într-un flux continuu, demonstrând o arhitectură modulară și scalabilă.

